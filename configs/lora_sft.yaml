model: Qwen/Qwen2.5-0.5B-Instruct
seed: 1337

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  epochs: 3
  lr: 2.0e-4
  batch_size: 8
  grad_accum: 2
  max_seq_len: 1024
  warmup_ratio: 0.03
  weight_decay: 0.01
  bf16: auto
  completion_only_loss: true
  save_steps: 250
  logging_steps: 20
