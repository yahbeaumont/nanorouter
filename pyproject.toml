[project]
name = "nanorouter"
version = "0.1.0"
description = "Fine-tune a 0.5B SLM to emit schema-valid routing JSON. Measured, reproducible, CPU-deployable."
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=4.44",
    "trl>=0.21,<0.24",
    "peft>=0.11",
    "datasets>=2.20",
    "accelerate>=0.30",
]
eval = ["numpy>=1.26"]
export = ["optimum[onnxruntime]>=1.21", "onnx>=1.16"]
serve = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "matplotlib>=3.9"]
hub = ["huggingface_hub>=0.24"]

[project.scripts]
nanorouter = "nanorouter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanorouter"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer.Option em default é o padrão da própria lib, não um bug.
"src/nanorouter/cli.py" = ["B008"]
# testes usam linhas longas com JSON inline para legibilidade.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["nanorouter"]
# Estes módulos só rodam com as extras pesadas (torch, optimum, fastapi) e são
# exercitados pelo workflow `eval` e pelo smoke do Docker, não pela suíte
# unitária — por isso ficam fora do denominador do --cov-fail-under.
omit = [
    "src/nanorouter/train.py",
    "src/nanorouter/export.py",
    "src/nanorouter/server.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
