name: eval
on:
  workflow_dispatch:
    inputs:
      adapter:
        description: Caminho ou repo HF do adapter
        required: true
        default: checkpoints/lora/final
      limit:
        description: Limite de exemplos
        required: false
        default: "200"
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Wheel de CPU: o torch do PyPI padrão traz CUDA e não é usado aqui.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e ".[eval,dev]" "transformers>=4.44" "peft>=0.11"
      - run: python -m nanorouter.cli data --out data --n 3000
      # Só o adapter: as baselines de prompt levam ~30 min em CPU de runner.
      - run: >
          python -m nanorouter.cli eval
          --adapter "${{ inputs.adapter }}"
          --skip-baselines
          --limit "${{ inputs.limit }}"
          --plot
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: outputs/eval
